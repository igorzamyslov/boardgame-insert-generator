<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A group on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF}:focus-visible{outline:3px solid #2F5BB8;outline-offset:2px}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F4F3EF; color: #1D1F1C; font-family: Figtree, system-ui, sans-serif; font-size: 16px">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; border-bottom: 1px solid #E4E1D9">
<div aria-hidden="true" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; background: #1D1F1C; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 5px; box-sizing: border-box">
<span style="border-radius: 2px; background: #8FB0EE"></span><span style="border-radius: 2px; background: #EDC175"></span><span style="border-radius: 2px; background: #86C79A"></span><span style="border-radius: 2px; background: #E89BBE"></span>
</div>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding-left: 8px">
<span style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Harbour Kings</span>
<span style="font-size: 12px; color: #5F625C">Saved in this browser</span>
</span>
<button type="button" aria-label="Undo" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
<button type="button" aria-label="Send file" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg></button>
<button type="button" aria-label="Project menu" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
<a href="MobileDownload.dc.html" aria-label="Download" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #1D1F1C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></a>
</header>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: #DDF0E3; color: #2B7247; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px">Everything fits</h1>
<span style="font-size: 13px; color: #5F625C">6 trays in 1 layer, 38 of 70 mm high</span>
</span>
<button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; font-weight: 600; font-size: 14px">3D</button>
</div>

<div style="padding: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="position: relative; width: 358px; aspect-ratio: 1; border-radius: 14px; background: #D3CDBF; box-shadow: inset 0 0 0 1px #BFB8A8">
<sc-for list="{{trays}}" as="t" hint-placeholder-count="6">
<a href="MobileTray.dc.html" aria-label="{{t.aria}}" style="{{t.style}}"><sc-for list="{{t.cells}}" as="cell"><span style="{{cell.style}}"></span></sc-for><span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><span style="{{t.nameStyle}}">{{t.label}}</span></span></a>
</sc-for>
</div>
<span style="font-size: 12px; color: #5F625C">Front of the box</span>
</div>

<div role="region" aria-label="What's inside" style="position: absolute; left: 0; right: 0; bottom: 0; height: 468px; box-sizing: border-box; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(29,31,28,.14); padding: 0 0 8px; display: flex; flex-direction: column; gap: 4px">
<button type="button" aria-label="Show less" style="align-self: center; width: 120px; height: 44px; flex-shrink: 0; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #D6D2C8"></span></button>
<div style="display: flex; align-items: center; padding: 0 16px; gap: 8px">
<h2 style="margin: 0; flex-grow: 1; font-size: 16px">
<button type="button" aria-expanded="true" aria-controls="sheet-list" style="width: 100%; display: flex; align-items: center; gap: 6px; height: 44px; border: 0; background: none; padding: 0; text-align: left">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px">What's inside</span>
<span style="font-size: 14px; color: #5F625C">5</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</h2>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; font-weight: 600; font-size: 15px">+ Add</button>
</div>
<div id="sheet-list" style="display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding: 0 8px 12px">
<a href="MobileBox.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px; border-radius: 12px; text-decoration: none">
<span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; border: 2px solid #6E695C"></span>
<span style="flex-grow: 1; font-weight: 600">The box</span>
<span style="font-size: 14px; color: #5F625C">285 × 285 × 70 mm</span>
</a>

<div role="group" aria-label="Player kit, 4 copies" style="display: flex; flex-direction: column; padding: 2px 0; border-radius: 14px; border: 1px solid #E4E1D9; background: #FAF9F6">
<a href="MobileEdit.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px 0 10px; border-radius: 12px; text-decoration: none">
<span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #3E413C"></span>
<span style="flex-grow: 1; display: flex; align-items: baseline; gap: 6px"><span style="font-weight: 600">Player kit</span><span style="font-weight: 600; color: #5F625C">×4</span></span>
<span style="font-size: 14px; color: #5F625C">3 items</span>
</a>
<sc-for list="{{members}}" as="m" hint-placeholder-count="3">
<a href="MobileEdit.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; margin-left: 16px; padding: 0 8px 0 10px; border-radius: 0 12px 12px 0; border-left: 2px solid #E4E1D9; text-decoration: none">
<span aria-hidden="true" style="{{m.swatch}}"></span>
<span style="flex-grow: 1; font-weight: 600">{{m.name}}</span>
<span style="font-size: 14px; color: #5F625C">{{m.meta}}</span>
</a>
</sc-for>
</div>

<sc-for list="{{rows}}" as="c" hint-placeholder-count="2">
<a href="MobileEdit.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px; border-radius: 12px; text-decoration: none">
<span aria-hidden="true" style="{{c.swatch}}"></span>
<span style="flex-grow: 1; font-weight: 600">{{c.name}}</span>
<span style="font-size: 14px; color: #5F625C">{{c.meta}}</span>
</a>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const K = {
  cards: { fill: '#DCE6FA', line: '#335AA6', ink: '#22457E' },
  bits: { fill: '#FBE9C9', line: '#8A5D08', ink: '#6E4C0E' },
  tiles: { fill: '#D8EEDE', line: '#2E6B41', ink: '#22552E' },
  minis: { fill: '#F5DCE7', line: '#964068', ink: '#74244B' }
};
const KIT = [['cards', 1.4], ['bits', 1], ['bits', 1], ['bits', 1], ['minis', 1.1]];
const TRAYS = [
  { kind: 'cards', name: 'Market deck', x: 0, y: 0, w: 95, d: 190 },
  { kind: 'tiles', name: 'Hex tiles', x: 0, y: 190, w: 95, d: 95 },
  { group: true, name: 'Player kit 1', x: 95, y: 0, w: 190, d: 71.25 },
  { group: true, name: 'Player kit 2', x: 95, y: 71.25, w: 190, d: 71.25 },
  { group: true, name: 'Player kit 3', x: 95, y: 142.5, w: 190, d: 71.25 },
  { group: true, name: 'Player kit 4', x: 95, y: 213.75, w: 190, d: 71.25 }
];
const MEMBERS = [['Starter deck', 'cards', '12 cards'], ['Resources', 'bits', '30 pieces'], ['Hero', 'minis', '1 figure']];
const ROWS = [['Market deck', 'cards', '80 cards'], ['Hex tiles', 'tiles', '24 tiles']];
const swatch = (kind) => `width:14px;height:14px;flex-shrink:0;border-radius:4px;box-sizing:border-box;background:${K[kind].fill};border:2px solid ${K[kind].line}`;
class Component extends DCLogic {
  renderVals() {
    const trays = TRAYS.map((t) => {
      const k = t.kind ? K[t.kind] : null;
      const look = t.group ? 'background:#FFFFFF;border:2px solid #3E413C;' : `background:${k.fill};border:2px solid ${k.line};`;
      const cells = t.group ? KIT.map(([kind]) => ({ style: `border-radius:4px;background:${K[kind].fill};border:1.5px solid ${K[kind].line}` })) : [];
      const columns = t.group ? KIT.map(([, f]) => `${f}fr`).join(' ') : 'minmax(0,1fr)';
      return {
        label: t.name, aria: `${t.name} tray`, cells,
        style: `position:absolute;left:${(9 + t.x * 2) / 5.82}%;top:${(9 + t.y * 2) / 5.82}%;width:${(t.w * 2 - 6) / 5.82}%;height:${(t.d * 2 - 6) / 5.82}%;box-sizing:border-box;border-radius:10px;padding:5px;text-decoration:none;display:grid;grid-template-columns:${columns};gap:4px;${look}`,
        nameStyle: `display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.92);color:${t.group ? '#3E413C' : k.ink};white-space:nowrap`
      };
    });
    const members = MEMBERS.map(([name, kind, meta]) => ({ name, meta, swatch: swatch(kind) }));
    const rows = ROWS.map(([name, kind, meta]) => ({ name, meta, swatch: swatch(kind) }));
    return { trays, members, rows };
  }
}
</script>
</body>
</html>
