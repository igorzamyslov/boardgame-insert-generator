<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Building print file</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF}:focus-visible{outline:3px solid #2F5BB8;outline-offset:2px}@media (max-width:600px){[role=dialog]{border-radius:0 !important;padding:20px !important;max-width:none !important}}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="position: relative; height: 100vh; min-height: 560px; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box; background: #8E8B83; color: #1D1F1C; font-family: Figtree, system-ui, sans-serif; font-size: 15px">

<div role="dialog" aria-modal="true" aria-labelledby="ex-title" style="width: 100%; max-width: 560px; max-height: 100%; overflow: auto; background: #FFFFFF; border-radius: 22px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 80px rgba(29,31,28,.35)">
<div style="display: flex; align-items: flex-start; gap: 16px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px" aria-live="polite">
<h1 id="ex-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.01em">{{title}}</h1>
<span style="color: #5F625C">{{subtitle}}</span>
</div>
<a href="Main.dc.html" aria-label="Close" style="text-decoration: none; color: inherit; flex-shrink: 0; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #F4F3EF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<sc-if value="{{showBar}}" hint-placeholder-val="{{true}}">
<div role="progressbar" aria-label="Building parts" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="height: 10px; border-radius: 999px; background: #EFEDE7; overflow: hidden">
<div style="{{barStyle}}"></div>
</div>
</sc-if>

<sc-if value="{{showList}}" hint-placeholder-val="{{false}}">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{parts}}" as="p" hint-placeholder-count="10">
<li style="display: flex; flex-direction: column; gap: 6px; padding: 8px 4px; border-bottom: 1px solid #F0EEE8">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="{{p.swatch}}"></span>
<span style="flex-grow: 1; font-weight: 600">{{p.name}}</span>
<span style="{{p.stateStyle}}">{{p.state}}</span>
</div>
<sc-if value="{{p.failed}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: 30px; padding: 10px 12px; border-radius: 12px; background: #FCE6CF; color: #7A3A08; font-size: 14px; line-height: 1.45">
<span style="flex: 1 1 220px">Heroes couldn't be built. That's a bug on our side. Try again, or copy a report for us.</span>
<button type="button" onClick="{{retry}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #7A3A08; background: #FFFFFF; color: #7A3A08; cursor: pointer; font-weight: 600; font-size: 14px">Try again</button>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #7A3A08; background: #FFFFFF; color: #7A3A08; cursor: pointer; font-weight: 600; font-size: 14px">Copy a report</button>
</div>
</sc-if>
</li>
</sc-for>
</ul>
</sc-if>

<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end">
<sc-if value="{{canCancel}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{cancel}}" style="height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; cursor: pointer; font-weight: 600">Stop</button>
</sc-if>
<sc-if value="{{canRestart}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{restart}}" style="height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; cursor: pointer; font-weight: 600">Start again</button>
</sc-if>
<sc-if value="{{canPartial}}" hint-placeholder-val="{{false}}">
<button type="button" style="height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; cursor: pointer; font-weight: 600">Download without Heroes (that tray will be missing)</button>
</sc-if>
<sc-if value="{{canDownload}}" hint-placeholder-val="{{false}}">
<a href="Main.dc.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; height: 48px; padding: 0 20px; box-sizing: border-box; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; cursor: pointer; font-weight: 600">Back to the plan</a>
<button type="button" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: #1D1F1C; color: #FFFFFF; cursor: pointer; font-weight: 600">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
Download the 3MF file
</button>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showFailure":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
const PARTS = [
  { name: 'Market deck', fill: '#DCE6FA', line: '#335AA6' },
  { name: 'Starter decks', fill: '#DCE6FA', line: '#335AA6' },
  { name: 'Hex tiles', fill: '#D8EEDE', line: '#2E6B41' },
  { name: 'Dice', fill: '#FBE9C9', line: '#8A5D08' },
  { name: 'Heroes', fill: '#F5DCE7', line: '#964068', fails: true },
  { name: 'Coins and cubes', fill: '#FBE9C9', line: '#8A5D08' },
  { name: 'Spacer, bottom layer', fill: null, line: '#6E695C' },
  { name: 'Event cards', fill: '#DCE6FA', line: '#335AA6' },
  { name: 'Resource tokens', fill: '#FBE9C9', line: '#8A5D08' },
  { name: 'Spacer, top layer', fill: null, line: '#6E695C' }
];

class Component extends DCLogic {
  componentDidMount() { this.run(false); }
  componentWillUnmount() { clearInterval(this.timer); }
  run(fixed) {
    clearInterval(this.timer);
    this.setState({ phase: fixed ? 'retrying' : 'building', p: fixed ? 40 : 0, fixed });
    this.timer = setInterval(() => {
      const st = this.state || {};
      const p = Math.min(100, (st.p || 0) + 3);
      if (p >= 100) {
        clearInterval(this.timer);
        this.setState({ p: 100, phase: st.fixed || !this.props.showFailure ? 'done' : 'partial' });
      } else this.setState({ p });
    }, 90);
  }
  renderVals() {
    const st = this.state || {};
    const phase = st.phase || 'building';
    const p = st.p || 0;
    const working = phase === 'building' || phase === 'retrying';
    const doneCount = Math.floor(p / 10);
    const failMode = !!this.props.showFailure;
    const parts = PARTS.map((part, i) => {
      let state = 'Waiting', color = '#5F625C', failed = false;
      if (phase === 'cancelled') { state = i < doneCount ? 'Built' : 'Stopped'; }
      else if (phase === 'retrying' && !part.fails) { state = 'Built'; color = '#2B7247'; }
      else if (phase === 'retrying' && part.fails) { state = 'Building…'; color = '#2F5BB8'; }
      else if (i < doneCount || phase === 'done' || phase === 'partial') {
        if (part.fails && failMode && !st.fixed) { state = 'Failed'; color = '#9A4A0B'; failed = phase === 'partial'; }
        else { state = 'Built'; color = '#2B7247'; }
      } else if (i === doneCount && working) { state = 'Building…'; color = '#2F5BB8'; }
      return {
        name: part.name, state, failed,
        stateStyle: `font-size:14px;font-weight:600;color:${color}`,
        swatch: `width:18px;height:18px;flex-shrink:0;border-radius:5px;box-sizing:border-box;${part.fill ? `background:${part.fill};border:2px solid ${part.line}` : `border:2px dashed ${part.line}`}`
      };
    });
    const titles = {
      building: ['Building your print file', `${doneCount} of 10 parts built`],
      retrying: ['Trying Heroes again', '9 of 10 parts built'],
      partial: ['9 of 10 parts are ready', 'Heroes couldn\'t be built.'],
      done: ['All 10 parts are ready', 'One file with every part.'],
      cancelled: ['Stopped', 'Nothing was downloaded.']
    };
    return {
      title: titles[phase][0],
      subtitle: titles[phase][1],
      parts,
      pct: p,
      showBar: working,
      showList: phase === 'partial' || phase === 'retrying',
      barStyle: `height:100%;width:${p}%;border-radius:999px;background:#1D1F1C;transition:width .09s linear`,
      canCancel: working,
      canRestart: phase === 'cancelled',
      canPartial: phase === 'partial',
      canDownload: phase === 'done',
      cancel: () => { clearInterval(this.timer); this.setState({ phase: 'cancelled' }); },
      restart: () => this.run(false),
      retry: () => this.run(true)
    };
  }
}
</script>
</body>
</html>
