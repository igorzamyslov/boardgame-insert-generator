name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR/branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (eslint, stylelint, html-validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm run lint
        run: npm run lint

  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm run format:check
        run: npm run format:check

  typecheck:
    name: Typecheck (app and node tsconfigs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm run typecheck
        run: npm run typecheck

  # The suite is split across runners; the `test` job below gathers the parts under the name
  # branch protection requires. Two sizing files take ~2 minutes each, so each gets a runner
  # of its own (vitest --shard balances by file, not by duration) and the rest is sharded.
  # When a test file is added, it lands in the "rest" shards by itself.
  test-part:
    name: Tests (vitest) ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tray.sizing-tiles
            args: src/geometry/tray.sizing-tiles.test.ts
          - name: tray.sizing
            args: src/geometry/tray.sizing.test.ts
          - name: rest 1/2
            args: --shard=1/2 --exclude src/geometry/tray.sizing-tiles.test.ts --exclude src/geometry/tray.sizing.test.ts
          - name: rest 2/2
            args: --shard=2/2 --exclude src/geometry/tray.sizing-tiles.test.ts --exclude src/geometry/tray.sizing.test.ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm test (${{ matrix.name }})
        run: npm test -- ${{ matrix.args }}

  # Keeps the old job name: "Tests (vitest)" is a required check in the repository ruleset.
  test:
    name: Tests (vitest)
    if: ${{ always() }}
    needs: [test-part]
    runs-on: ubuntu-latest
    steps:
      - name: All test parts passed
        run: |
          [ "${{ needs.test-part.result }}" = "success" ]

  build:
    name: Build, third-party licences, dist smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production build (also writes dist/third-party-licenses.txt via licenses.config.ts)
        run: npx vite build
      - name: Dist smoke test (relative URLs, workers, WASM, licence text names every bundled library)
        run: node scripts/smoke-dist.mjs dist

  audit:
    name: Audit (npm audit, shipped dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Blocking - high+ advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Informational - full tree incl. dev tooling
        run: npm audit --audit-level=high || echo "::warning::npm audit reports high advisories in dev tooling"

  # Single gate: require just this check in branch protection (it keeps the old
  # name, so an existing "verify" required check keeps working).
  verify:
    name: verify
    if: ${{ always() }}
    needs: [lint, format, typecheck, test, build, audit]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]

  # Every merge to main is a release, so a pull request must raise package.json's version
  # (the one the footer shows) above main's. Renovate lock-file-only updates are exempt
  # (see scripts/check-version-bump.mjs).
  version-bump:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: git show "origin/${{ github.base_ref }}:package.json" > "$RUNNER_TEMP/base-package.json"
      - id: changed
        run: |
          {
            echo "files<<EOF"
            git diff --name-only "origin/${{ github.base_ref }}" HEAD
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - run: node scripts/check-version-bump.mjs "$RUNNER_TEMP/base-package.json" package.json
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
