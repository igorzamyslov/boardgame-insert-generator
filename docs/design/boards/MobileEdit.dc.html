<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editing a component on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF}:focus-visible{outline:3px solid #2F5BB8;outline-offset:2px}label:focus-within>span{box-shadow:0 0 0 3px #CFDCF6}
a{color:#1D1F1C}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; color: #1D1F1C; font-family: Figtree, system-ui, sans-serif; font-size: 16px">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; border-bottom: 1px solid #EEEBE4">
<a href="MobileWorkspace.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px">Heroes</h1>
<a href="MobileWorkspace.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; background: #1D1F1C; color: #FFFFFF; text-decoration: none; font-weight: 600">Done</a>
</header>

<div style="flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: #F4F3EF; border-bottom: 1px solid #EEEBE4">
<div aria-hidden="true" style="position: relative; width: 84px; height: 84px; flex-shrink: 0; border-radius: 8px; background: #D3CDBF">
<span style="position: absolute; left: 3px; top: 3px; width: 26px; height: 54px; border-radius: 3px; background: #DCE6FA; opacity: .5"></span>
<span style="position: absolute; left: 30px; top: 3px; width: 25px; height: 25px; border-radius: 3px; background: #DCE6FA; opacity: .5"></span>
<span style="position: absolute; left: 56px; top: 3px; width: 25px; height: 39px; border-radius: 3px; background: #D8EEDE; opacity: .5"></span>
<span style="position: absolute; left: 30px; top: 29px; width: 25px; height: 25px; border-radius: 3px; background: #FBE9C9; opacity: .5"></span>
<span style="position: absolute; left: 3px; top: 58px; width: 26px; height: 23px; border-radius: 3px; background: #FBE9C9; opacity: .5"></span>
<span style="position: absolute; left: 56px; top: 43px; width: 25px; height: 38px; box-sizing: border-box; border-radius: 3px; background: #F5DCE7; border: 2px solid #964068"></span>
</div>
<span style="font-size: 14px; line-height: 1.45; color: #3E413C">The tray changes as you type. It's on the bottom layer, front right.</span>
</div>

<div style="flex-grow: 1; overflow: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 600">Figures</span>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid #E4E1D9">
<div style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1; font-weight: 600">Hero figures</span>
<button type="button" aria-label="Fewer" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; font-size: 20px">−</button>
<input type="text" inputmode="numeric" value="6" aria-label="Number of hero figures" style="width: 56px; height: 44px; box-sizing: border-box; padding: 0; text-align: center; border-radius: 12px; border: 1px solid #DAD6CC; background: #FFFFFF; font-weight: 700; font-size: 18px">
<button type="button" aria-label="More" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DAD6CC; background: #FFFFFF; font-size: 20px">+</button>
</div>
<span style="font-size: 13px; color: #5F625C">Measure one figure, base included</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F625C">Wide<span style="display: flex; align-items: center; height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #DAD6CC"><input type="text" inputmode="decimal" enterkeyhint="next" value="30" style="width: 100%; border: 0; font-size: 17px; font-weight: 600; background: none"><span style="font-size: 14px">mm</span></span></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F625C">Deep<span style="display: flex; align-items: center; height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #DAD6CC"><input type="text" inputmode="decimal" enterkeyhint="next" value="30" style="width: 100%; border: 0; font-size: 17px; font-weight: 600; background: none"><span style="font-size: 14px">mm</span></span></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5F625C">Tall<span style="display: flex; align-items: center; height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #DAD6CC"><input type="text" inputmode="decimal" enterkeyhint="next" value="38" style="width: 100%; border: 0; font-size: 17px; font-weight: 600; background: none"><span style="font-size: 14px">mm</span></span></label>
</div>
</div>
<button type="button" style="align-self: flex-start; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px dashed #6E695C; background: none; font-weight: 600; font-size: 14px">+ Another size of figure</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 600">How they're stored</span>
<div style="display: flex; padding: 3px; border-radius: 999px; background: #EFEDE7" role="group" aria-label="How they're stored">
<button type="button" aria-pressed="true" style="flex: 1; white-space: nowrap; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; box-shadow: 0 1px 2px rgba(29,31,28,.12); font-weight: 600">One pocket each</button>
<button type="button" aria-pressed="false" style="flex: 1; white-space: nowrap; height: 44px; border-radius: 999px; border: 0; background: none; color: #5F625C">Loose in a bin</button>
</div>
</div>

<button type="button" aria-expanded="false" style="display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 60px; padding: 0; border: 0; border-top: 1px solid #EEEBE4; border-bottom: 1px solid #EEEBE4; background: none; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">More options</span><span style="font-size: 13px; color: #5F625C">Finger cuts on, curved floor off</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</button>

<div style="border-top: 1px solid #EEEBE4; padding-top: 8px; display: flex; justify-content: center"><button type="button" style="height: 44px; padding: 0 14px; border: 0; background: none; color: #A13A2C; font-weight: 600; font-size: 14px">Remove Heroes…</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
