name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than cancel it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The type checks, the Vite build and the dist smoke test. Not the tests: main only
      # takes pull requests whose CI (sharded tests included) passed, and CI runs again on
      # the push to main.
      # The feedback form's settings are repository variables (Settings, Secrets and variables,
      # Actions, Variables); both are public values. Empty until the Worker is deployed: the
      # form then sends people to GitHub instead. See worker/feedback/README.md.
      - run: npm run build:deploy
        env:
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
          # The GoatCounter site code, a repository variable (not a secret). Absent: the build
          # counts nothing.
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
