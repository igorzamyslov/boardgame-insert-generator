<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; color: #1D1F1C; font-family: Figtree, system-ui, sans-serif; font-size: 16px">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; border-bottom: 1px solid #EEEBE4">

</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5F625C">Length
<span style="display: flex; align-items: center; height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid #DAD6CC; background: #FFFFFF"><input type="text" inputmode="decimal" enterkeyhint="next" value="285" style="width: 100%; min-width: 0; border: 0; font-size: 17px; font-weight: 600; background: none"><span style="color: #5F625C; font-size: 14px">mm</span></span>

</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid #EEEBE4">
<span style="font-weight: 600">Keep space free on top</span>
<div style="display: flex; align-items: center; gap: 8px">
<label style="display: flex; align-items: center; height: 48px; width: 96px; flex-shrink: 0; padding: 0 10px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #1D1F1C; background: #FFFFFF; gap: 4px"><input type="text" inputmode="decimal" enterkeyhint="next" value="8" aria-label="Space on top, mm" style="width: 100%; min-width: 0; border: 0; font-size: 17px; font-weight: 600; background: none"><span style="color: #5F625C; font-size: 14px">mm</span></label>
<div style="flex-grow: 1; display: flex; padding: 3px; border-radius: 999px; background: #EFEDE7" role="group" aria-label="How much of the top">
<button type="button" aria-pressed="true" style="flex: 1; white-space: nowrap; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; box-shadow: 0 1px 2px rgba(29,31,28,.12); font-weight: 600; font-size: 14px">Whole top</button>

</div>
</div>
<span style="font-size: 13px; line-height: 1.4; color: #5F625C">Part of it: only where the rulebook lies. Trays fill the rest.</span>

<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding-top: 18px; border-top: 1px solid #EEEBE4">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 600">The box is stored on its side</span><span style="font-size: 13px; color: #5F625C">Trays then fill up to the lid, so nothing falls out</span></span>
<input type="checkbox" style="width: 24px; height: 24px; flex-shrink: 0; accent-color: #1D1F1C">
</label>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 18px; border-top: 1px solid #EEEBE4">
<span style="font-weight: 600; font-size: 14px; color: #3E413C">Side view of the box</span>
<div aria-hidden="true" style="width: 358px; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; box-shadow: inset 0 0 0 2px #8C8778; background: #D3CDBF">
<div style="height: 30px; display: flex; align-items: center; justify-content: center; border-bottom: 2px dashed #6E695C; background: #FFFFFF; color: #3E413C; font-size: 13px; font-weight: 600">Kept free, 8 mm</div>
<div style="height: 70px; display: flex; gap: 5px; padding: 5px; box-sizing: border-box">
<span style="flex: 1; border-radius: 7px; background: #DCE6FA; border: 2px solid #335AA6"></span>
<span style="flex: 2; border-radius: 7px; background: #FBE9C9; border: 2px solid #8A5D08"></span>

<div style="height: 108px; display: flex; gap: 5px; padding: 5px; box-sizing: border-box">
<span style="flex: 1; border-radius: 7px; background: #DCE6FA; border: 2px solid #335AA6"></span>
<span style="flex: 1; border-radius: 7px; background: #FBE9C9; border: 2px solid #8A5D08"></span>
<span style="flex: 1; border-radius: 7px; background: #F5DCE7; border: 2px solid #964068"></span>
</div>
</div>
<span style="font-size: 13px; color: #5F625C">Trays fill the 62 mm below.</span>
</div>
