<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Measure a board game box and list what goes in it; get a 3D-printable insert of stacking trays."
    />
    <meta name="theme-color" content="#F4F3EF" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Board Game Insert Generator</title>
    <!-- prettier-ignore -->
    <script>(function(){var t="system";try{var s=localStorage.getItem("insert-generator:theme");if(s==="light"||s==="dark")t=s}catch(e){}var d=t==="dark"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";var m=document.querySelector('meta[name="theme-color"]');if(m&&d)m.setAttribute("content","#1B1A17")})();</script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
