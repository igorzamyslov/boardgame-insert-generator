<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Kit gallery</title>
    <!-- prettier-ignore -->
    <script>(function(){var t="system";try{var s=localStorage.getItem("insert-generator:theme");if(s==="light"||s==="dark")t=s}catch(e){}var d=t==="dark"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";var m=document.querySelector('meta[name="theme-color"]');if(m&&d)m.setAttribute("content","#1B1A17")})();</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/kit/main.tsx"></script>
  </body>
</html>
