# The feedback Worker. Deploy from this folder: `npx wrangler deploy`. See README.md.
name = "insert-generator-feedback"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
GITHUB_REPO = "igorzamyslov/boardgame-insert-generator"
# Origins besides localhost that may call the Worker (no trailing slash).
ALLOWED_ORIGINS = "https://igorzamyslov.github.io"

# At most 5 messages a minute from one address. No KV or D1 needed.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never in this file): GITHUB_TOKEN and TURNSTILE_SECRET, set with `wrangler secret put`.
