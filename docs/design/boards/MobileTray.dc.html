<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A tray tapped on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F3EF}:focus-visible{outline:3px solid #2F5BB8;outline-offset:2px}
a{color:#1D1F1C}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F4F3EF; color: #1D1F1C; font-family: Figtree, system-ui, sans-serif; font-size: 16px">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; border-bottom: 1px solid #E4E1D9">
<div aria-hidden="true" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; background: #1D1F1C; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 5px; box-sizing: border-box">
<span style="border-radius: 2px; background: #8FB0EE"></span><span style="border-radius: 2px; background: #EDC175"></span><span style="border-radius: 2px; background: #86C79A"></span><span style="border-radius: 2px; background: #E89BBE"></span>
</div>
<span style="flex-grow: 1; min-width: 0; padding-left: 8px; font-weight: 700">Harbour Kings</span>
<button type="button" aria-label="Undo" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
<button type="button" aria-label="Send file" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg></button>
<button type="button" aria-label="Download" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #1D1F1C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></button>
</header>

<div style="padding: 12px 16px 0; display: flex; flex-direction: column; align-items: center">
<div style="position: relative; width: 358px; aspect-ratio: 1; border-radius: 14px; background: #D3CDBF; box-shadow: inset 0 0 0 1px #BFB8A8">
<sc-for list="{{trays}}" as="t" hint-placeholder-count="7">
<span style="{{t.style}}"><span style="{{t.nameStyle}}"><sc-if value="{{t.isCards}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="7" y="3" width="12" height="16" rx="2"></rect><path d="M5 7v12a2 2 0 0 0 2 2h9"></path></svg></sc-if><sc-if value="{{t.isBits}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path></svg></sc-if><sc-if value="{{t.isTiles}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></sc-if><sc-if value="{{t.isMinis}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="6.5" r="3"></circle><path d="M9.5 10.5h5l1.5 7h-8z"></path><path d="M6 20.5h12"></path></svg></sc-if>{{t.label}}</span></span>
</sc-for>
</div>
</div>

<div role="dialog" aria-modal="true" aria-labelledby="tray-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 404px; box-sizing: border-box; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(29,31,28,.18); padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #D6D2C8"></span>
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #F5DCE7; border: 2px solid #964068; color: #74244B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="6.5" r="3"></circle><path d="M9.5 10.5h5l1.5 7h-8z"></path><path d="M6 20.5h12"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column">
<h2 id="tray-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px">Heroes</h2>
<span style="font-size: 13px; color: #5F625C">Bottom layer · 6 figure pockets</span>
</span>
<a href="MobileWorkspace.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #F4F3EF; text-decoration: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<a href="MobileEdit.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; flex-shrink: 0; border-radius: 999px; background: #1D1F1C; color: #FFFFFF; text-decoration: none; font-weight: 600">Edit Heroes</a>
<dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; font-size: 15px">
<dt style="color: #5F625C">Size</dt><dd style="margin: 0; font-weight: 600">95 × 145 × 40 mm</dd>
<dt style="color: #5F625C">Printing</dt><dd style="margin: 0; font-weight: 600">about 3.5 h, 58 g</dd>
</dl>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 68px; border-radius: 14px; border: 0; background: #F4F3EF; font-weight: 600; font-size: 13px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 5 3 3H7l3-3z"></path><path d="M12 12v8"></path></svg>Pin here</button>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 68px; border-radius: 14px; border: 0; background: #F4F3EF; font-weight: 600; font-size: 13px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>Turn 90°</button>
<button type="button" aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 68px; padding: 6px; border-radius: 14px; border: 0; background: #F4F3EF; color: #6B6E68; font-weight: 600; font-size: 13px; cursor: not-allowed"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 16l9 5 9-5"></path></svg>To top layer<span style="font-size: 11px; font-weight: 400; line-height: 1.25">Too tall: needs 38 mm, top has 26 mm</span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const K = {
  cards: { fill: '#DCE6FA', line: '#335AA6', ink: '#22457E' },
  bits: { fill: '#FBE9C9', line: '#8A5D08', ink: '#6E4C0E' },
  tiles: { fill: '#D8EEDE', line: '#2E6B41', ink: '#22552E' },
  minis: { fill: '#F5DCE7', line: '#964068', ink: '#74244B' }
};
const TRAYS = [
  { kind: 'cards', name: 'Market deck', x: 0, y: 0, w: 95, d: 190 },
  { kind: 'cards', name: 'Starter decks', x: 95, y: 0, w: 95, d: 95 },
  { kind: 'tiles', name: 'Hex tiles', x: 190, y: 0, w: 95, d: 140 },
  { kind: 'bits', name: 'Coins, cubes', x: 95, y: 95, w: 95, d: 95 },
  { kind: 'bits', name: 'Dice', x: 0, y: 190, w: 95, d: 95 },
  { kind: null, name: 'Spacer', x: 95, y: 190, w: 95, d: 95 },
  { kind: 'minis', name: 'Heroes', x: 190, y: 140, w: 95, d: 145, sel: true }
];
class Component extends DCLogic {
  renderVals() {
    const trays = TRAYS.map((t) => {
      const k = t.kind ? K[t.kind] : null;
      const look = k ? `background:${k.fill};border:2px solid ${k.line};` : 'background:repeating-linear-gradient(135deg,#E9E5DB 0 6px,#DDD8CC 6px 12px);border:2px dashed #6E695C;';
      return {
        label: t.name, isCards: !!t.sel && t.kind === 'cards', isBits: !!t.sel && t.kind === 'bits', isTiles: !!t.sel && t.kind === 'tiles', isMinis: !!t.sel && t.kind === 'minis',
        style: `position:absolute;left:${(9 + t.x * 2) / 5.82}%;top:${(9 + t.y * 2) / 5.82}%;width:${(t.w * 2 - 6) / 5.82}%;height:${(t.d * 2 - 6) / 5.82}%;box-sizing:border-box;border-radius:10px;display:flex;align-items:center;justify-content:center;opacity:${t.sel ? 1 : 0.5};${look}${t.sel ? 'box-shadow:0 0 0 3px #FFFFFF,0 0 0 5px #1D1F1C;' : ''}`,
        nameStyle: `display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.92);color:${k ? k.ink : '#3E413C'};white-space:nowrap`
      };
    });
    return { trays };
  }
}
</script>
</body>
</html>
